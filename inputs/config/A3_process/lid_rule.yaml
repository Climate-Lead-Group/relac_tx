# Lid rule override for relac_tx.
#
# 1) Switched from default 'proportional' to 'uniform' because proportional
# mode produced infeasible LPs in any year where pool_delta(cr, y) = 0
# (residual capacity flat or declining), where the proportional lid collapses
# to 0 and forbids new investment. Uniform mode uses base_pct(y) * mult(cr, y)
# * pool(cr, y), which always yields positive headroom whenever there is any
# residual capacity in cr.
#
# 2) Enabled zero_is_placeholder_in_lid_rows because the relac_tx upstream
# pipeline (A1_Pre_processing_OG_csvs.py) marks the whole MaxInv row of a
# PWR tech as "needs lid" by emitting 9999 in some years and leaving spurious
# 0s in early base-year cells. Those 0s do NOT represent intentional caps —
# they are missing-data artifacts. With this flag on, the lid overwrites them
# too (only in rows that already contain at least one 9999). Rows without any
# 9999 (e.g., PWRNGS* in countries where Natural Gas expansion is policy-
# prohibited — every year is 0 explicitly, no 9999 anywhere) are preserved.
# Required to resolve CPLEX infeasibility on PWRBIODOMXX 2023-2025 in BAU.
#
# 3) Global schedule override (2026-05-22):
# The script's default schedule (5% / 10% / 20%) was too loose for relac_tx
# country pool sizes. First override (5% / 3% / 5%) tightened 2030+ but the
# renewable build-out in 2035 was still unrealistic per domain review.
# Applying an additional -25% across the whole schedule (the values written
# to xlsx by the lid become 75% of the previous override).
#
#   2023-2029  =  3.75%  (was 5%,  -25%)
#   2030-2039  =  2.25%  (was 3%,  -25%)   <- horizon where 2035 build-out lives
#   2040-2050  =  3.75%  (was 5%,  -25%)
#
# 4) Per-prefix override for wind, geothermal, and solar PV (2026-05-22):
# Even with the global schedule tightened, BAU output still showed wind
# (PWRWON*/PWRWOF*) and geothermal (PWRGEO*) growing from a small base in
# 2023 to dominating renewable production by 2050.
# The fix is selective: leave non-renewables and hydro/biomass on the global
# schedule, but apply a much tighter schedule to WON/WOF/GEO. The override
# bites every year (including 2023-2029) so base-year capacity doesn't
# expand under the existing 3.75% cap either. GEO is tighter than WON/WOF
# because its capacity-factor is ~2.6x higher (0.80 vs 0.30), so the same
# pct on capacity yields 2.6x more annual PJ — pct on capacity must be
# correspondingly smaller for an equivalent PJ-level constraint.
#
# After the first BAU re-run with WON/WOF/GEO override and --force-overwrite,
# solar PV (PWRSPV*) absorbed most of the GEO/WON gap (+165% in 2030,
# capacity +22-39%) — so SPV needs an override too. Same pct as WON/WOF
# because CF is similar (~0.20-0.30).
#
#   prefix WON  =  1.0% / 0.5% / 1.0%   (was 3.75% / 2.25% / 3.75% on global)
#   prefix WOF  =  1.0% / 0.5% / 1.0%
#   prefix GEO  =  0.5% / 0.3% / 0.5%
#   prefix SPV  =  1.0% / 0.5% / 1.0%   (added 2026-05-22 after SPV absorbed
#                                        the GEO gap in BAU iteration 1)
#
# 5) Per-prefix override for wave, biomass, hydro (2026-05-22, iter 2):
# After WON/WOF/GEO/SPV override + --force-overwrite, BAU still showed:
# wave (PWRWAV*) ballooning from 0 PJ in 2050 to 972 PJ; biomass (PWRBIO*)
# +84% in 2050; hydro (PWRHYD*) +96% in 2050. The system was substituting
# inside the renewable basket. To prevent this, override the remaining
# renewables too.
#
#   prefix WAV  =  0.3% / 0.2% / 0.3%   (high CF ~45%, similar to GEO)
#   prefix BIO  =  1.0% / 0.5% / 1.0%   (moderate CF ~70%)
#   prefix HYD  =  0.5% / 0.3% / 0.5%   (NOTE: HYD producibility jump
#                                        came from increased utilization,
#                                        NOT new investment. NewCapacity
#                                        HYD ≈ 0.06 GW/yr both V0 and V2.
#                                        Override is included for
#                                        completeness; to actually limit
#                                        HYD generation, use
#                                        TotalTechnologyAnnualActivityUpperLimit
#                                        which is outside the LID script.)
#
# 6) Absolute lid for unfleeted gen techs (2026-05-25):
# The pool-based lid only fires for techs that have residual capacity or
# required builds — wave (PWRWAV*) has zero residual everywhere on Earth, and
# geothermal in countries without a fleet (ARG/BOL/BRA/BRB/COL/DOM/ECU/HTI/
# PAN/PER/PRY/URY) is in the same situation. Without a per-prefix absolute
# cap, MaxCapInv stays empty for those techs and the optimizer can build
# unlimited GW (e.g. MEX wave hit 26.5 GW in 2025 of a tech with ~0 GW
# commercial deployment worldwide).
#
#   WAV  = 0     # non-commercial; ban new investment in BAU
#   GEO  = 0.2   # GW/year for unfleeted countries — starting calibration
#                # point; tune up if a country has documented potential and
#                # the cap binds, tune down if the optimizer is still
#                # over-deploying.
#
# Scaled by demand mult when ramp_from_demand is on (default), so the cap
# at the reference year (2024) equals the configured value and grows linearly
# with each cr's demand.

rule_mode: uniform
zero_is_placeholder_in_lid_rows: true

percentage_by_year:
  "2023-2029": 0.0375
  "2030-2039": 0.0225
  "2040-2050": 0.0375

percentage_by_year_by_prefix:
  WON:
    "2023-2029": 0.010
    "2030-2039": 0.005
    "2040-2050": 0.010
  WOF:
    "2023-2029": 0.010
    "2030-2039": 0.005
    "2040-2050": 0.010
  GEO:
    "2023-2029": 0.005
    "2030-2039": 0.003
    "2040-2050": 0.005
  SPV:
    "2023-2029": 0.010
    "2030-2039": 0.005
    "2040-2050": 0.010
  WAV:
    "2023-2029": 0.003
    "2030-2039": 0.002
    "2040-2050": 0.003
  BIO:
    "2023-2029": 0.010
    "2030-2039": 0.005
    "2040-2050": 0.010
  HYD:
    "2023-2029": 0.005
    "2030-2039": 0.003
    "2040-2050": 0.005

absolute_by_prefix:
  WAV: 0
  GEO: 0.2

# 7) Per-tech flat overrides (2026-05-25, CTO request):
# Forces a constant MaxCapacityInvestment (GW/year) across the full horizon for
# specific PWR tech codes. Overrides BOTH the pool-based lid formula and the
# preserved_manual rule (i.e., overwrites whatever D3 or any prior loader
# wrote, including the 2029 spike).
#
# Use when the step+spike pattern coming from D3_load_lac_max_capacity_caps.py
# + a stale Min*1.01 untie event is not desired and a flat schedule is
# preferred. Standard untie rule still applies: in any year where
# MinCapInv > flat value, the cell is bumped to MinCapInv * 1.01.
#
# Add tech codes as needed (one entry per tech-country combination):
#
#   flat_overrides_by_tech:
#     PWRWONBRAXX: 3.5   # Onshore wind, Brazil — flat 3.5 GW/yr 2023-2050
#     PWRSPVBRAXX: 5.5   # Solar PV,    Brazil — flat 5.5 GW/yr 2023-2050
#
# Set to {} or omit the block entirely to disable.
flat_overrides_by_tech:
  PWRWONBRAXX: 3.5
  PWRSPVBRAXX: 5.5

# 8) LowerLimit scenario scope (2026-06-01, per-type filter added 2026-06-02):
# Controls which scenarios receive the TotalTechnologyAnnualActivityLowerLimit
# floor extension (extend_lowerlimits_pwr.py, which extends the 2024 PWR floor
# flat to 2050) in the A3 orchestrator, and — per scenario — for WHICH PWR
# technology types the floor is imposed.
#
# Semantics are OPT-IN: a scenario gets the floor extension ONLY if its name
# appears as a key in `lowerlimit_scenarios`. A scenario NOT listed (or this
# whole key omitted/empty) is left untouched — extend_lowerlimits_pwr.py is
# skipped for it.
#
# B1b V3 (which only *relaxes* an infeasible floor to max_activity*0.99, never
# imposes one) runs ALWAYS for every scenario as a feasibility safeguard and is
# NOT gated here. This block also does NOT affect the MaxCapacityInvestment lid
# (steps 1 / V1 / V2), which always run for every scenario.
#
# Per-scenario value (alcance):
#   all        -> extend the floor for ALL PWR techs (the 18 types).
#   <group>    -> extend only techs whose type (chars 4-6 of the code,
#                 TECHNOLOGY[3:6]) is in the named group below.
#   [T1, T2]   -> extend only the listed 3-char type codes (inline list).
#
# ALL scenarios use `renewable` so the floor is imposed on renewable generation
# only; non-renewable PWR techs (incl. nuclear URN) get NO floor from 2027
# onward. The historical/near-term floor through 2026 is preserved (it lives in
# the 2023-2026 columns and is harmonized to BAU by historical_sync_through).
#
# History (2026-06-17): BAU/INV used to impose the floor on `all` PWR types; the
# CTO decided the floor should apply to renewables only across every scenario.
# The `all` mode is INTENTIONALLY KEPT (resolved to None by
# load_lowerlimit_scenarios in A3_process.py) so it can be re-enabled later by
# setting a scenario back to `all` — no code change required. The pre-existing
# non-renewable floor that prior `all` runs baked into BAU/INV for 2027-2050 was
# removed once from the xlsx by t1_confection/clear_lowerlimits_pwr.py (a one-off
# data cleanup; extend_lowerlimits_pwr.py only adds, never removes).
#
# The scenario keys are the suffixes used under A1_Outputs/
# (A1_Outputs_<scenario>), e.g. BAU, INV, OPT. A plain YAML list (old format)
# is still accepted and treated as `all` for each listed scenario.

# Tech-type groups (chars 4-6 of the PWR code, TECHNOLOGY[3:6]).
lowerlimit_tech_groups:
  renewable: [BIO, GEO, CSP, SPV, HYD, WAS, WAV, WON, WOF]

lowerlimit_scenarios:
  BAU: renewable  # floor on renewables only (was `all`; non-renewables no longer floored 2027+)
  INV: renewable  # floor on renewables only (was `all`; non-renewables no longer floored 2027+)
  OPT: renewable
  VGB: renewable  # VEGETATIVO_B: same scope as the rest (floor on renewables only)

# 9) Near-term harmonization with BAU (2026-06-04):
# As its FINAL step, A3_process.py forces the early-year columns of each listed
# scenario to match BAU exactly, by invoking sync_historical_from_bau.py
# (positional copy of BAU's year cells into the target workbook). This runs
# AFTER the lid rule, the lowerlimit extension, and B1b for every scenario, so
# it overrides any divergence those steps — or the BAU-only caps written by
# D3_load_lac_max_capacity_caps.py — introduced in the harmonized window for
# the target scenario.
#
# Per scenario: the THROUGH year (inclusive). Years 2023..<through> are copied
# from BAU; the scenario is free to diverge from <through>+1 onward.
#
#   OPT -> 2026 : pinned to BAU through 2026 INCLUDING transmission, diverging
#                 only from 2027. D4 does NOT cap OPT's TX (it rejects
#                 --scenario OPT), so OPT is listed in historical_sync_tx_follow_bau
#                 below to switch OFF the built-in TX protection — OPT's TX
#                 MaxCapInv (TRN*) IS synced to BAU through 2026. (2026-06-16.)
#   INV -> 2030 : INV mirrors BAU through 2030 for everything EXCEPT transmission.
#                 D4_load_dsptrn_max_cap_inv.py caps transmission MaxCapInv from
#                 2027 (cap = NewCapacity_BAU * factor; factor 1.0 in 2027-2030,
#                 then 0.99->0.80 over 2031-2050), so TX diverges from 2027 — INV
#                 now EQUALS BAU in TX through 2026 too. The sync skips the TX
#                 MaxCapInv rows (TRN*) only for years >= 2027 (TX_DIVERGE_YEAR),
#                 so it does NOT snap D4's caps back to BAU but the 2026 TX IS
#                 synced. Generation and the rest still mirror BAU through 2030.
#                 (Equalize-INV/VGB-in-2026 change 2026-06-16; original
#                 INV-mirrors-BAU-through-2030 CTO request 2026-06-04.)
#
# Only year-value cells are copied; Projection.Mode and other key columns are
# left intact (a row may legitimately be 'User defined' because its 2031+ cells
# differ). A scenario omitted here (or this whole block empty/absent) is NOT
# harmonized. BAU is the source and is never a target. Disable for a run with
# --skip-historical-sync.
historical_sync_through:
  INV: 2030
  OPT: 2026
  VGB: 2030   # VEGETATIVO_B mirrors BAU through 2030 like INV, EXCEPT the
              # parameters protected below (LowerLimit + PEGs).

# 10) Per-scenario sync protection (2026-06-08; boundary moved to 2027 2026-06-16):
# Parameters listed here for a scenario are NOT copied from BAU for years >=
# PROTECT_PARAMS_FROM_YEAR (now 2027; see sync_historical_from_bau.py) during the
# historical_sync_through pass (forwarded as --protect-params). NOTE: the key name
# keeps "_from_2026" as a stable label, but the EFFECTIVE boundary is 2027 — years
# <= 2026 are ALWAYS synced to BAU so every scenario equals BAU through 2026; the
# protected divergence applies only from 2027. This generalizes the built-in
# transmission MaxCapInv protection: use it when a scenario deliberately diverges
# from BAU on a parameter from 2027 onward and that divergence must survive the
# sync (which otherwise OVERRIDES everything in the synced window because it runs
# as A3's final step). A scenario not listed protects nothing.
#
# VGB syncs to BAU through 2030 (like INV) but keeps its own FROM 2027 ONWARD
# (equals BAU in 2026; the divergence starts 2027):
#   - TotalTechnologyAnnualActivityLowerLimit : renewable-only floor. Keeps VGB's
#     own renewable floor from 2027 instead of snapping it to BAU's. (Since BAU is
#     now also renewable-only, the old rationale of "stop BAU re-imposing a flat
#     non-renewable floor here" no longer applies — non-renewables have no floor
#     2027+ in any scenario — but protecting the renewable floor is still correct.)
#   - TotalAnnualMinCapacityInvestment        : the PEGs, set equal to OPT.
#     Without protection the sync would snap them back to BAU for 2027-2030.
#   - TotalAnnualMaxCapacityInvestment        : upper bound; must stay >= the PEGs
#     or the model is infeasible. Without protection the sync snaps Max back to BAU
#     (below the protected PEG) for 2027-2030 -> Max < Min (B1b V1). Protecting it
#     preserves the Max>=Min that A3's B1b sets BEFORE the final sync. (2026-06-16.)
historical_sync_protect_from_2026:
  VGB:
    - TotalTechnologyAnnualActivityLowerLimit
    - TotalAnnualMinCapacityInvestment
    - TotalAnnualMaxCapacityInvestment

# 11) Per-scenario transmission sync (2026-06-16):
# By default sync_historical_from_bau.py PROTECTS transmission MaxCapInv (TRN*)
# rows from being snapped back to BAU for years >= TX_DIVERGE_YEAR (now 2027),
# because D4 caps INV's transmission from 2027 and that divergence must survive
# the sync. Scenarios listed here OPT OUT of that built-in TX protection
# (forwarded as --no-protect-tx), so their transmission MaxCapInv is fully synced
# to BAU across the ENTIRE historical_sync_through window (every year, no 2027
# boundary). Use only for scenarios that D4 does NOT cap. A scenario not listed
# keeps the default TX protection (TX synced through 2026, protected from 2027).
#
#   OPT: D4 does not cap OPT's transmission (it rejects --scenario OPT), so OPT's
#        TX must follow BAU across its whole window (2023-2026). INV and VGB are
#        intentionally NOT listed: with the 2027 boundary they already EQUAL BAU
#        in TX through 2026 (synced), while their TX from 2027 stays protected —
#        INV keeps its D4 cap, VGB keeps its inherited TX. Listing them would
#        wrongly snap their 2027-2030 TX back to BAU.
historical_sync_tx_follow_bau:
  - OPT
