# ReadTheDocs build configuration. Two RTD projects share this file:
# the main one (language: en) and its Spanish translation (language: es);
# RTD passes -D language=<code> automatically per project.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt
