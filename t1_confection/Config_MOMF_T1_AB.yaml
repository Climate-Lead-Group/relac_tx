    # Model external dependencies: Directories, Files, sheets and columns
########################################################################################
# Directories
A2_output: 'A2_Output_Params'
A2_output_otoole: 'A2_Outputs_Params_otoole'
Miscellaneous: 'Miscellaneous'
templates: 'templates'
executables: 'Executables'
outputs: 'Outputs'
concatenate_folder: 'concatenate_files'

# Files
otoole_config: 'conversion_format.yaml'
preprocess_data: 'preprocess_data.py'
osemosys_model: 'osemosys_fast_preprocessed.txt'
conv_format: 'conversion_format.yaml'
concat_csvs: 'concatenate_relac.py'
inputs_file: 'Inputs.csv'
outputs_file: 'Outputs.csv'

# Prefixes and suffixes
prefix_final_files: 'RELAC_TX_'
preprocess_data_name: 'Pre_processed_'
output_files: '_output'

base_scenario: 'BAU'

# Configuration parameters
########################################################################################
solver: 'cplex' # Could you use: 'glpk', 'cbc', 'cplex' and 'gurobi'

# For CBC use
iteration_time: 20000
cbc_random_seed: 12345        # Random seed for reproducibility

# For CPLEX use
cplex_threads: 12
cplex_random_seed: 12345      # Random seed for reproducibility

# For Gurobi use
gurobi_threads: 20
gurobi_seed: 12345            # Random seed for reproducibility

# For delete intermediate files
del_files: False

# For run only the main scenarios
only_main_scenario: False

# Paralle scenarios
parallel: False
# Number of scenario per run
max_x_per_iter: 4

# Write A2 otoole outputs
A2_otoole_outputs: True

# Write txt model
write_txt_model: True

# Create matrixes
create_matrix: True

# Execute OSeMOSYS model
execute_model: True

# Concatenate otoole csv
concat_otoole_csv: True

# Concatenate scenarios csv
concat_scenarios_csv: True

# Annualize capital investment
annualize_capital: True

########################################################################################
# === Storage delay (block storage builds for first N years, then release) ===
# Master switch. False (or absent) = pipeline runs unchanged.
# When True: mutually exclusive with strip_storage_active (strip is silently
# turned off). The solver is redirected to the patched OSeMOSYS model file
# produced by patch_storage_delay.py, and combined inputs/outputs are written
# with `storage_delay_prefix_final_files` so baseline RELAC_TX_* artifacts are
# not overwritten.
storage_delay_active: True
storage_delay_first_n_years: 5
storage_delay_storage_prefixes:
  - SDS
  - LDS
# storage_delay_storages: []          # exact storage names (overrides prefixes if set)
storage_delay_allowed_value: "-1"     # PWR cap value applied in open years (-1 = unconstrained)
storage_delay_suffix: "StorageDelayN5"
storage_delay_model_output: "osemosys_fast_preprocessed_storage_delay.txt"
storage_delay_prefix_final_files: "RELAC_TX_StorageDelay_"
storage_delay_root_datafile: "RELAC_TX_data_storage_delay.txt"

########################################################################################
# === Storage stripping diagnostic ===
# Master switch. False (or absent) = pipeline runs unchanged (no strip).
strip_storage_active: True

# --- Tier 3: zero storage (baseline) ---
strip_storage_mode: "all"
strip_storage_targets: []
strip_storage_suffix: "NoStorage"

# --- Tier 1: just LKA SDS ---  (uncomment & comment Tier 3 above to use)
# strip_storage_mode: "tech"
# strip_storage_targets: ["SDSLKAXX01"]
# strip_storage_suffix: "NoLKASDS"

# --- Tier 2: all SDS (keep LDS) ---
# strip_storage_mode: "class"
# strip_storage_targets: ["SDS"]
# strip_storage_suffix: "NoSDS"

########################################################################################
# === PWRBCK cap-opening diagnostic ===
# Opens TotalAnnualMaxCapacity and TotalAnnualMaxCapacityInvestment for PWRBCK*
# backstop techs. Runs after strip_storage and before the careful XLSX repair.
open_pwrbck_active: True
open_pwrbck_value: 9999
open_pwrbck_pattern: "PWRBCK"
open_pwrbck_suffix: "OpenBCK"

########################################################################################
# === Older blunt reserve-margin repair ===
# Keep this disabled for the XLSX careful path. It is preserved in the B2 copy
# for compatibility, but the XLSX patcher below is the one intended for this config.
reserve_margin_repair_active: False

########################################################################################
# === Careful XLSX reserve-margin repair ===
# This calls patch_reserve_margin_repair_careful_xlsx.py.
# It produces e.g.:
#   Pre_processed_BAU_0_NoStorage_OpenBCK_RMCarefulXLSX.txt
reserve_margin_xlsx_active: True
reserve_margin_xlsx_suffix: "RMCarefulXLSX"
reserve_margin_xlsx_workbook: "firm_capacity_fallbacks_by_cr.xlsx"
reserve_margin_xlsx_sheet: "fallbacks"

# Reserve tag repairs.
# 1.0 means PWRBCK capacity gets full reserve capacity credit.
reserve_margin_xlsx_backstop_credit: 1.0

# 0.9 means 90% of PWRCCS installed capacity counts for reserve.
reserve_margin_xlsx_ccs_credit: 0.9

# Target firm fossil technologies whose stock/flow cap sentinel values may be replaced.
reserve_margin_xlsx_target_prefixes:
  - PWRPET
  - PWROIL
  - PWRNGS

# Only these current values are replaced in TotalAnnualMaxCapacity and
# TotalAnnualMaxCapacityInvestment. Other values are left untouched.
reserve_margin_xlsx_sentinel_values:
  - 0
  - 9999

# Year cutoff: the patcher only replaces sentinel caps in years >= this value.
# Historical/observed years (2023-2025) are left exactly as the upstream
# produced them, so the firm-capacity fallback does not introduce a divergence
# between scenarios in the early years (mirrors A3's MODIFY_FROM_YEAR=2026).
# Set to null/unset to patch every year (legacy behaviour).
reserve_margin_xlsx_modify_from_year: 2026

# Global ReserveMargin value applied to every (REGION, YEAR) tuple.
# When set, the careful XLSX patcher rewrites the ReserveMargin param block
# with explicit entries instead of relying on the GMPL default (1.0).
# Set to null/unset to leave the existing block untouched.
reserve_margin_xlsx_global_value: 0.15

# Optional stricter final-style alternatives:
# Use ONE of these after the diagnostic case solves.
#
# Alternative A: leave PWRBCK at default/no reserve credit.
# reserve_margin_xlsx_patch_backstop: False
#
# Alternative B: explicitly set PWRBCK reserve credit to zero.
# reserve_margin_xlsx_backstop_credit: 0

########################################################################################
# === Activity Upper Limit (cap on TotalTechnologyAnnualActivityUpperLimit) ===
# Reads rows from "Secondary Techs" of A-O_Parametrization.xlsx where
# Parameter == activity_upper_limit_parameter_label. Cell values are fractions
# in [0,1] of the per-country electricity demand (SpecifiedAnnualDemand) for
# that year. The patcher converts fraction -> absolute activity cap and writes
# them into the TotalTechnologyAnnualActivityUpperLimit block of the .txt.
#
# Per-scenario: activity_upper_limit_scenarios lists scenario names where the
# patch applies; data for each scenario lives in that scenario's own xlsx.
activity_upper_limit_active: False
activity_upper_limit_scenarios: ["BAU"]
activity_upper_limit_parameter_label: "TotalTechnologyAnnualActivityUpperLimit_fraction"
activity_upper_limit_demand_fuel_prefixes: ["ELC"]
activity_upper_limit_tech_prefixes: ["PWR"]
activity_upper_limit_exclude_prefixes: ["PWRSDS", "PWRLDS", "PWRBCK", "PWRTRN"]
activity_upper_limit_suffix: "ActUpLim"
# V4 sum-of-fractions coverage check tolerance (per region/fuel/year).
# If sum(fractions across capped techs) < 1.0 - tolerance, B1b raises a V4
# warning (no auto-fix, just an early heads-up).
activity_upper_limit_coverage_tolerance: 0.15

########################################################################################
# === Sync patched CSVs back into the original A2 otoole input folder ===
# After the patcher chain runs, extract parameter blocks from the final patched
# .txt and OVERWRITE IN PLACE the matching CSVs inside
# A2_Outputs_Params_otoole/<scen>/. generate_combined_input_file() then reads
# from this folder so the patched values appear in
# RELAC_TX_StorageDelay_Combined_Inputs_Outputs.csv (and the legacy
# RELAC_TX_Combined_Inputs_Outputs.csv when storage_delay is off).
#
# Note: this writes into the original A2 folder in place, so re-running the
# pipeline regenerates the CSVs from A1 before the patcher chain re-applies.
sync_patched_csvs_active: True
sync_patched_csvs_params:
  - ReserveMargin
  - ReserveMarginTagTechnology
  - TotalAnnualMaxCapacity
  - TotalAnnualMaxCapacityInvestment
  - TotalAnnualMinCapacity
  - TotalAnnualMinCapacityInvestment
  - TotalTechnologyAnnualActivityUpperLimit

########################################################################################
# === Dispatch floors (fix_dispatch/write_floors.py, pisos fosiles) ===
dispatch_floors_active: True
dispatch_floors_suffix: "FLOORED"
dispatch_floors_script: "../fix_dispatch/write_floors.py"      # relativo a t1_confection
dispatch_floors_scenarios: ["BAU", "OPT", "INV", "VGB"]        # base; los derivados heredan
# Gate de separacion (read-only) ANTES de escribir pisos; exit!=0 aborta el pipeline.
preflight_separation_active: True
preflight_separation_script: "../fix_dispatch/preflight_separation.py"